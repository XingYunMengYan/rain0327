<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四路线卡牌对战 — 面对面模式</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

    <!-- 共享工具库 -->
    <script src="shared.js"></script>
    <script src="cardEffects.js"></script>
    <!-- 游戏核心规则（所有模式共享） -->
    <script src="gameManager.js"></script>

    <style>
        #cheat-ui {
            position: fixed; bottom: 10px; left: 10px; z-index: 10000;
            background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px;
            display: flex; gap: 6px; flex-direction: column;
            border: 2px solid #f59e0b;
        }
        #cheat-card-id {
            width: 80px; padding: 6px; border-radius: 4px;
            border: none; outline: none; font-size: 12px;
        }
        #cheat-ui button {
            background: #f59e0b; color: white; padding: 6px 12px;
            border-radius: 4px; font-weight: bold; font-size: 12px;
            border: none; cursor: pointer;
        }
        #cheat-ui button:hover {
            background: #d97706;
        }

        /* 战场牌碰撞动画 */
        @keyframes collide-up {
            0% { transform: translateY(0); opacity: 1; }
            40% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes collide-down {
            0% { transform: translateY(0); opacity: 1; }
            40% { transform: translateY(20px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 数值变动动画 - 放大缩小 + 变红色 */
        @keyframes stat-change {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ef4444 !important; }
            100% { transform: scale(1); }
        }

        .animate-collide-up {
            animation: collide-up 0.6s ease-out !important;
        }

        .animate-collide-down {
            animation: collide-down 0.6s ease-out !important;
        }

        .animate-stat-change {
            animation: stat-change 0.6s ease-out !important;
        }
    </style>
</head>
<body>
    <!-- 作弊UI（仅 localGame 有，现已移到左下角） -->
    <div id="cheat-ui">
        <div style="color: #f59e0b; font-size: 11px; font-weight: bold; text-align: center;">⚙️ 作弊工具</div>
        <input type="number" id="cheat-card-id" placeholder="卡牌ID">
        <button type="button" onclick="window.spawnCheatCard()">刷入手牌</button>
    </div>

    <div id="root"></div>

    <script type="text/babel">
    // ============================================================
    // localGame — 面对面模式
    // 职责：面对面选牌流程、作弊功能、换位功能
    // 游戏规则全部委托给 GameManager
    // ============================================================
    const { useState, useEffect, useCallback } = React;
    const GM = window.GameManager;

    const LocalGame = () => {
      const [uiReady, setUiReady] = useState(false);
      useEffect(() => {
        window.GameUILoader.load().then(() => setUiReady(true));
        window.SoundManager.restoreFromStorage();
      }, []);

      const [allCards,        setAllCards]       = useState([]);
      const [gameState,       setGameState]      = useState(GM.INIT_STATE());
      const [gamePhase,       setGamePhase]      = useState('notStarted');
      const [winner,          setWinner]         = useState(null);
      const [battleAnimation, setBattleAnimation] = useState({ active: false, lane: -1 });
      const [cardShowOverlay, setCardShowOverlay] = useState(null);
      const [swapMode,        setSwapMode]       = useState(null);

      useEffect(() => {
        window.loadCards()
          .then(cards => setAllCards(cards))
          .catch(() => alert('无法加载 card_data.csv，请确保文件在同一目录下并通过本地服务器访问。'));
      }, []);

      const addLog = useCallback((msg) => {
        setGameState(prev => ({ ...prev, log: [...prev.log, msg] }));
      }, []);

      const showCardOverlay = useCallback((card) => {
        setCardShowOverlay(card);
        window.SoundManager.playSound(card.type === 'miracle' ? 'miracle' : 'place');
        setTimeout(() => setCardShowOverlay(null), 2000);
      }, []);

      // ── 初始化 ──
      const initGame = useCallback(() => {
        if (!allCards.length) return;
        setGameState(GM.initGame(allCards));
        setGamePhase('notStarted');
        setWinner(null);
      }, [allCards]);

      useEffect(() => { if (allCards.length) initGame(); }, [allCards, initGame]);
      useEffect(() => {
        const handler = () => setWinner(null);
        window.addEventListener('gameui:review', handler);
        return () => window.removeEventListener('gameui:review', handler);
      }, []);

      // ── 作弊功能（localGame 专属） ──
      useEffect(() => {
        window.spawnCheatCard = () => {
          const id = Number(document.getElementById('cheat-card-id')?.value);
          if (!id || !allCards.length) return;
          const cardData = allCards.find(c => c.id === id);
          if (!cardData) { alert('未找到该ID的卡牌！'); return; }
          const newCard = window.createCard(cardData);
          const currentPlayer = (gameState.phase === 'redDeploy' || gameState.phase === 'redSupport') ? 'red'
            : (gameState.phase === 'blueDeploy' || gameState.phase === 'blueSupport') ? 'blue' : 'red';
          setGameState(prev => ({
            ...prev,
            [currentPlayer]: { ...prev[currentPlayer], hand: [...prev[currentPlayer].hand, newCard] },
            log: [...prev.log, `[作弊] ${currentPlayer === 'red' ? '红方' : '蓝方'}获得卡牌：${newCard.name}`]
          }));
        };
        return () => delete window.spawnCheatCard;
      }, [allCards, gameState.phase]);

      // ── 开始选牌 ──
      const startPicking = () => {
        setGamePhase('redPicking');
        addLog('--- 红方选牌阶段 ---');
      };

      // ── 选牌逻辑（面对面：双方轮流在同一屏幕上选） ──
      const pickCard = (card) => {
        if (gamePhase === 'redPicking') {
          const newHand = [...gameState.red.hand, card];
          const remaining = gameState.initialCards.filter(c => c.instanceId !== card.instanceId);
          if (newHand.length === 3) {
            setGameState(prev => ({
              ...prev,
              red: { ...prev.red, hand: newHand },
              initialCards: prev.initialCardsBlue,
              deck: window.shuffleArray([...prev.deck, ...remaining])
            }));
            setGamePhase('bluePicking');
            addLog('红方选牌完成 → 蓝方选牌阶段');
          } else {
            setGameState(prev => ({ ...prev, red: { ...prev.red, hand: newHand }, initialCards: remaining }));
            addLog(`红方选择了 ${card.name}`);
          }
        } else if (gamePhase === 'bluePicking') {
          const newHand = [...gameState.blue.hand, card];
          const remaining = gameState.initialCards.filter(c => c.instanceId !== card.instanceId);
          if (newHand.length === 3) {
            setGameState(prev => ({
              ...prev,
              blue: { ...prev.blue, hand: newHand },
              initialCards: [],
              deck: window.shuffleArray([...prev.deck, ...remaining])
            }));
            setGamePhase('playing');
            addLog('蓝方选牌完成 → 点击"下一回合"开始游戏');
          } else {
            setGameState(prev => ({ ...prev, blue: { ...prev.blue, hand: newHand }, initialCards: remaining }));
            addLog(`蓝方选择了 ${card.name}`);
          }
        }
      };

      // ── 回合开始 ──
      const startTurn = () => {
        const newState = GM.doStartTurn(gameState);
        setGameState(newState);
      };

      // ── 选择手牌 ──
      const selectCard = (card, player) => {
        if (gameState.phase === 'idle' || gameState.phase === 'battle') return;
        const isRedPhase = gameState.phase === 'redDeploy' || gameState.phase === 'redSupport';
        if ((isRedPhase && player !== 'red') || (!isRedPhase && player !== 'blue')) return;
        if (gameState.selectedCard?.instanceId === card.instanceId) {
          setGameState(prev => ({ ...prev, selectedCard: null }));
          return;
        }
        setGameState(prev => ({ ...prev, selectedCard: card }));
      };

      // ── 部署战场牌 ──
      const playCard = (laneIndex, isBuilding = false) => {
        const card = gameState.selectedCard;
        if (!card || card.type !== 'battlefield') return;
        const player = GM.getPhasePlayer(gameState.phase);
        const result = GM.playCard(gameState, card, player, laneIndex, isBuilding);
        if (result.error) { addLog(result.error); return; }
        
        // 骑士(42)等登场效果在 cardEffects.js 中处理，触发 EffectEngine
        let newState = result.state;
        if (window.EffectEngine && window.CardEffectConfigs?.[card.id]?.trigger === 'onDeploy') {
          const effectContext = {
            player, card,
            laneIndex,
            logCallback: (msg) => newState.log.push(msg)
          };
          newState = window.EffectEngine.trigger(card.id, effectContext, newState);
        }
        setGameState(newState);
      };

      // ── 使用支援/奇迹（指定目标） ──
      const useCardOnTarget = (targetPlayer, laneIndex) => {
        const card = gameState.selectedCard;
        if (!card || (card.type !== 'support' && card.type !== 'miracle')) return;
        const player = GM.getPhasePlayer(gameState.phase);
        const result = GM.useCardOnTarget(gameState, card, player, targetPlayer, laneIndex);
        if (result.error) { addLog(result.error); return; }
        showCardOverlay(card);
        setGameState(result.state);
      };

      // ── 使用支援/奇迹（无目标确认） ──
      const confirmUse = () => {
        const card = gameState.selectedCard;
        if (!card) return;
        const player = GM.getPhasePlayer(gameState.phase);
        // 检查是否需要进入换位模式（空间法术、替名等）
        const swapCheck = GM.checkRequiresSwapMode(card, player);
        if (swapCheck) {
          setSwapMode(swapCheck.swapMode);
          addLog(swapCheck.logMsg);
          return; // 不立即消耗卡牌，等 finishSwapMode
        }
        const result = GM.confirmUse(gameState, card, player);
        if (result.error) { addLog(result.error); return; }
        showCardOverlay(card);
        setGameState(result.state);
      };

      // ── 阶段结束 ──
      const endPhase = () => {
        // 清除空间法师本阶段标记
        const cleaned = GM.clearSpaceMageFlags(gameState);
        const target = GM.getNextPhase(cleaned.phase);
        if (target === 'battle') {
          setGameState(prev => { const s = GM.clearSpaceMageFlags(prev); return { ...s, phase: 'battle', selectedCard: null, log: [...s.log, '--- 战斗阶段 ---'] }; });
          setTimeout(resolveBattle, 500);
        } else {
          setGameState(prev => { const s = GM.clearSpaceMageFlags(prev); return { ...s, phase: target, selectedCard: null, log: [...s.log, `--- ${GM.PHASE_NAMES[target]} ---`] }; });
        }
      };

      // ── 战斗结算（委托给 GameManager） ──
      const resolveBattle = async () => {
        await GM.resolveBattle(gameState, {
          setBattleAnimation,
          onLaneResolve: (laneIndex, result) => {
            // 每条战线计算完成后立即更新卡牌在UI中的显示
            setGameState(prev => {
              const newState = JSON.parse(JSON.stringify(prev));
              newState.red.battlefield[laneIndex] = result.red;
              newState.blue.battlefield[laneIndex] = result.blue;
              if (result.redBuilding) newState.red.buildings[laneIndex] = result.redBuilding;
              if (result.blueBuilding) newState.blue.buildings[laneIndex] = result.blueBuilding;
              // 🔴 实时更新玩家血量
              newState.red.health = result.redHP;
              newState.blue.health = result.blueHP;
              return newState;
            });
          },
          onFinish: ({ state: finalState, winner: w }) => {
            setGameState(finalState);
            if (w) setWinner(w);
            setTimeout(() => {
              setGameState(prev => {
                const result = GM.checkDeckEmpty(prev, w);
                if (result) { setWinner(result.winner); return result.state; }
                return prev;
              });
            }, 100);
          }
        });
      };

      // ── 换位模式（委托给 GameManager） ──

      // 战场格子点击：换位模式下处理选择/交换，非换位模式下正常部署/使用
      const handleBattlefieldClick = (clickedPlayer, clickedLane) => {
        if (swapMode) {
          const currentPhasePlayer = GM.getPhasePlayer(gameState.phase);
          const result = GM.handleSwapClick(gameState, swapMode, clickedPlayer, clickedLane, currentPhasePlayer);
          if (result.error) { addLog(result.error); return; }
          if (result.logMsg)      addLog(result.logMsg);
          if (result.continueMsg) addLog(result.continueMsg);
          if (result.state) setGameState(result.state);
          if (result.done) {
            // swapBattlefield 完成后立即走 finishSwapMode
            const finalState = GM.finishSwapMode(result.state, swapMode);
            setGameState(finalState);
            setSwapMode(null);
            window.SoundManager.playSound('click');
          } else if (result.swapMode !== undefined) {
            setSwapMode(result.swapMode);
          }
          return;
        }
        // 非换位模式：正常部署/使用卡牌
        const canDeploy = gameState.selectedCard?.type === 'battlefield' &&
          ((gameState.phase === 'redDeploy' && clickedPlayer === 'red') ||
           (gameState.phase === 'blueDeploy' && clickedPlayer === 'blue'));
        const canTarget = gameState.selectedCard && window.EffectEngine?.needsTarget(gameState.selectedCard.id);
        if (canDeploy)      playCard(clickedLane);
        else if (canTarget) useCardOnTarget(clickedPlayer, clickedLane);
      };

      // 空间法师激活（点击战场上已部署的空间法师时调用）
      const activateSpaceMage = (player, lane) => {
        const result = GM.activateSpaceMage(gameState, player, lane);
        if (result.error) { addLog(result.error); return; }
        setSwapMode(result.swapMode);
        addLog(result.logMsg);
        window.SoundManager.playSound('click');
      };

      // 完成换位
      const finishSwapMode = () => {
        if (!swapMode) return;
        const finalState = GM.finishSwapMode(gameState, swapMode);
        setGameState(finalState);
        setSwapMode(null);
        window.SoundManager.playSound('click');
      };

      // 取消换位
      const cancelSwapMode = () => {
        setSwapMode(null);
        addLog('取消操作');
      };

      // ── 重置 ──
      const reset = () => {
        setWinner(null);
        setGamePhase('notStarted');
        setBattleAnimation({ active: false, lane: -1 });
        initGame();
      };

      if (!uiReady) return <div className="text-white text-center mt-40 text-xl">加载中…</div>;

      return (
        <GameUI
          gameState={gameState}
          gamePhase={gamePhase}
          allCards={allCards}
          winner={winner}
          battleAnimation={battleAnimation}
          cardShowOverlay={cardShowOverlay}
          swapMode={swapMode}
          onStartPicking={startPicking}
          onPickCard={pickCard}
          onStartTurn={startTurn}
          onSelectCard={selectCard}
          onPlayCard={playCard}
          onUseCardOnTarget={useCardOnTarget}
          onConfirmUse={confirmUse}
          onEndPhase={endPhase}
          onReset={reset}
          onBattlefieldClick={handleBattlefieldClick}
          onFinishSwap={finishSwapMode}
          onCancelSwap={cancelSwapMode}
          onActivateSpaceMage={activateSpaceMage}
          hideOpponentHand={false}
          gameMode="ai"
          myRole={null}
        />
      );
    };

    ReactDOM.render(<LocalGame />, document.getElementById('root'));
    </script>
</body>
</html>
