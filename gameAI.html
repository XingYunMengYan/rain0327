<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四路线卡牌对战 — AI对战模式</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="shared.js"></script>
    <script src="cardEffects.js"></script>
    <!-- 游戏核心规则（所有模式共享） -->
    <script src="gameManager.js"></script>
    <style>
        /* 战场牌碰撞动画 */
        @keyframes collide-up {
            0% { transform: translateY(0); opacity: 1; }
            40% { transform: translateY(-20px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes collide-down {
            0% { transform: translateY(0); opacity: 1; }
            40% { transform: translateY(20px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 数值变动动画 - 放大缩小 + 变红色 */
        @keyframes stat-change {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ef4444 !important; }
            100% { transform: scale(1); }
        }

        .animate-collide-up {
            animation: collide-up 0.6s ease-out !important;
        }

        .animate-collide-down {
            animation: collide-down 0.6s ease-out !important;
        }

        .animate-stat-change {
            animation: stat-change 0.6s ease-out !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    // ============================================================
    // gameAI — AI对战模式
    // 职责：AI决策引擎、难度选择、轮盘抽签
    // 游戏规则全部委托给 GameManager
    // ============================================================
    const { useState, useEffect, useCallback, useRef } = React;
    const GM = window.GameManager;

    // ══════════════════════════════════════════════════════════
    // AI 决策引擎（三难度）
    // ══════════════════════════════════════════════════════════
    const AIEngine = {
      easy(gameState, player) {
        const { hand, coins, battlefield: bf } = gameState[player];
        const affordable = hand.filter(c => c.type === 'battlefield' && c.cost <= coins);
        if (affordable.length > 0) {
          const card = affordable[Math.floor(Math.random() * affordable.length)];
          const emptyLanes = bf.map((c, i) => c === null ? i : -1).filter(i => i >= 0);
          if (emptyLanes.length > 0) {
            return { action: 'playCard', card, lane: emptyLanes[Math.floor(Math.random() * emptyLanes.length)] };
          }
        }
        const support = hand.filter(c => (c.type === 'support' || c.type === 'miracle') && (c.type === 'miracle' ? true : c.cost <= coins));
        if (support.length > 0 && Math.random() > 0.5) return { action: 'useSupport', card: support[Math.floor(Math.random() * support.length)] };
        return { action: 'pass' };
      },

      medium(gameState, player) {
        const { hand, coins, battlefield: bf } = gameState[player];
        const opponent = player === 'red' ? 'blue' : 'red';
        const affordable = hand.filter(c => c.type === 'battlefield' && c.cost <= coins);
        if (affordable.length > 0) {
          affordable.sort((a, b) => (b.atk / Math.max(b.cost, 0.5)) - (a.atk / Math.max(a.cost, 0.5)));
          const emptyLanes = bf.map((c, i) => c === null ? i : -1).filter(i => i >= 0);
          if (emptyLanes.length > 0) {
            const contested = emptyLanes.filter(i => gameState[opponent].battlefield[i] !== null);
            const lane = contested.length > 0 ? contested[Math.floor(Math.random() * contested.length)] : emptyLanes[Math.floor(Math.random() * emptyLanes.length)];
            return { action: 'playCard', card: affordable[0], lane };
          }
        }
        const support = hand.filter(c => c.type === 'support' && c.cost <= coins);
        if (support.length > 0 && coins >= 3) return { action: 'useSupport', card: support[0] };
        return { action: 'pass' };
      },

      hard(gameState, player) {
        const { hand, coins, battlefield: bf } = gameState[player];
        const opponent = player === 'red' ? 'blue' : 'red';
        const myHP = gameState[player].health;
        const threats = gameState[opponent].battlefield.map((c, i) => c ? { lane: i, atk: c.atk } : null).filter(Boolean);
        threats.sort((a, b) => b.atk - a.atk);
        const miracle = hand.find(c => c.type === 'miracle');
        if (miracle && myHP <= 15) return { action: 'useSupport', card: miracle };
        const affordable = hand.filter(c => c.type === 'battlefield' && c.cost <= coins);
        if (affordable.length > 0) {
          affordable.sort((a, b) => b.atk - a.atk);
          const emptyLanes = bf.map((c, i) => c === null ? i : -1).filter(i => i >= 0);
          if (emptyLanes.length > 0) {
            let targetLane = emptyLanes[0];
            for (const t of threats) { if (emptyLanes.includes(t.lane)) { targetLane = t.lane; break; } }
            return { action: 'playCard', card: affordable[0], lane: targetLane };
          }
        }
        const support = hand.filter(c => c.type === 'support' && c.cost <= coins);
        if (support.length > 0 && coins >= 5) return { action: 'useSupport', card: support[0] };
        return { action: 'pass' };
      },

      pickCards(cards, difficulty) {
        const battlefield = cards.filter(c => c.type === 'battlefield');
        const support = cards.filter(c => c.type === 'support');
        if (difficulty === 'easy') {
          const shuffled = [...cards].sort(() => Math.random() - 0.5);
          return [shuffled[0], shuffled[1]];
        } else if (difficulty === 'medium') {
          battlefield.sort((a, b) => b.atk - a.atk);
          return battlefield.slice(0, 2).length === 2 ? battlefield.slice(0, 2) : cards.slice(0, 2);
        } else {
          battlefield.sort((a, b) => b.atk - a.atk);
          const pick2 = support[0] || battlefield[1] || cards.find(c => c !== battlefield[0]);
          return [battlefield[0], pick2].filter(Boolean);
        }
      }
    };

    // ══════════════════════════════════════════════════════════
    // 主组件
    // ══════════════════════════════════════════════════════════
    const AIGame = () => {
      const [uiReady, setUiReady] = useState(false);
      useEffect(() => { window.GameUILoader.load().then(() => setUiReady(true)); window.SoundManager.restoreFromStorage(); }, []);

      const [allCards,        setAllCards]       = useState([]);
      const [gameState,       setGameState]      = useState(GM.INIT_STATE());
      const [gamePhase,       setGamePhase]      = useState('notStarted');
      const [winner,          setWinner]         = useState(null);
      const [battleAnimation, setBattleAnimation] = useState({ active: false, lane: -1 });
      const [cardShowOverlay, setCardShowOverlay] = useState(null);
      const [myRole,          setMyRole]         = useState(null);
      const [aiRole,          setAiRole]         = useState(null);
      const [difficulty,      setDifficulty]     = useState('medium');
      const [showRoulette,    setShowRoulette]   = useState(false);
      const [rouletteResult,  setRouletteResult] = useState(null);
      const [swapMode,        setSwapMode]       = useState(null);
      const aiThinking = useRef(false);

      useEffect(() => {
        window.loadCards().then(cards => setAllCards(cards)).catch(() => alert('无法加载 card_data.csv'));
      }, []);

      const addLog = useCallback((msg) => { setGameState(prev => ({ ...prev, log: [...prev.log, msg] })); }, []);

      const showCardOverlay = useCallback((card) => {
        setCardShowOverlay(card);
        window.SoundManager.playSound(card.type === 'miracle' ? 'miracle' : 'place');
        setTimeout(() => setCardShowOverlay(null), 2000);
      }, []);

      const initGame = useCallback(() => {
        if (!allCards.length) return;
        setGameState(GM.initGame(allCards));
        setGamePhase('notStarted');
        setWinner(null);
      }, [allCards]);

      useEffect(() => { if (allCards.length) initGame(); }, [allCards, initGame]);
      useEffect(() => {
        const handler = () => setWinner(null);
        window.addEventListener('gameui:review', handler);
        return () => window.removeEventListener('gameui:review', handler);
      }, []);

      // ── 抽签轮盘（AI模式专属） ──
      const spinRoulette = () => {
        setShowRoulette(true);
        window.SoundManager.playSound('click');
        setTimeout(() => {
          const result = Math.random() > 0.5 ? 'red' : 'blue';
          setRouletteResult(result);
          setMyRole(result);
          setAiRole(result === 'red' ? 'blue' : 'red');
          addLog(`抽签结果：你是 ${result === 'red' ? '红方' : '蓝方'}`);
          addLog(`AI 是 ${result === 'red' ? '蓝方' : '红方'} | 难度：${difficulty === 'easy' ? '简单' : difficulty === 'medium' ? '中等' : '困难'}`);
          setTimeout(() => { setShowRoulette(false); setGamePhase('redPicking'); addLog('--- 选牌阶段开始 ---'); }, 1500);
        }, 2000);
      };

      // ── 玩家选牌 ──
      const pickCard = (card) => {
        const isMyTurn = (gamePhase === 'redPicking' && myRole === 'red') || (gamePhase === 'bluePicking' && myRole === 'blue');
        if (!isMyTurn) return;
        window.SoundManager.playSound('click');

        if (gamePhase === 'redPicking') {
          const newHand = [...gameState.red.hand, card];
          const remaining = gameState.initialCards.filter(c => c.instanceId !== card.instanceId);
          if (newHand.length === 3) {
            setGameState(prev => ({ ...prev, red: { ...prev.red, hand: newHand }, initialCards: prev.initialCardsBlue, deck: window.shuffleArray([...prev.deck, ...remaining]) }));
            setGamePhase('bluePicking');
            addLog('红方选牌完成');
            if (aiRole === 'blue') setTimeout(() => aiPickCards('blue'), 800);
          } else {
            setGameState(prev => ({ ...prev, red: { ...prev.red, hand: newHand }, initialCards: remaining }));
            addLog(`红方选择了 ${card.name}`);
          }
        } else if (gamePhase === 'bluePicking') {
          const newHand = [...gameState.blue.hand, card];
          const remaining = gameState.initialCards.filter(c => c.instanceId !== card.instanceId);
          if (newHand.length === 3) {
            setGameState(prev => ({ ...prev, blue: { ...prev.blue, hand: newHand }, initialCards: [], deck: window.shuffleArray([...prev.deck, ...remaining]) }));
            setGamePhase('playing');
            addLog('蓝方选牌完成 → 选牌阶段结束');
          } else {
            setGameState(prev => ({ ...prev, blue: { ...prev.blue, hand: newHand }, initialCards: remaining }));
            addLog(`蓝方选择了 ${card.name}`);
          }
        }
      };

      // ── AI 选牌 ──
      const aiPickCards = (player) => {
        const picked = AIEngine.pickCards(gameState.initialCards, difficulty);
        const remaining = gameState.initialCards.filter(c => !picked.includes(c));
        setGameState(prev => ({
          ...prev,
          [player]: { ...prev[player], hand: [...prev[player].hand, ...picked] },
          initialCards: player === 'red' ? prev.initialCardsBlue : [],
          deck: window.shuffleArray([...prev.deck, ...remaining])
        }));
        addLog(`${player === 'red' ? '红方' : '蓝方'}(AI) 已完成选牌`);
        if (player === 'red') { setGamePhase('bluePicking'); if (aiRole === 'blue') setTimeout(() => aiPickCards('blue'), 800); }
        else setGamePhase('playing');
      };

      // ── 回合开始 ──
      const startTurn = () => {
        setGameState(prev => GM.doStartTurn(prev));
      };

      // ── 玩家选牌 ──
      const selectCard = (card, player) => {
        if (player !== myRole || gameState.phase === 'idle' || gameState.phase === 'battle') return;
        const isRedPhase = gameState.phase === 'redDeploy' || gameState.phase === 'redSupport';
        if ((isRedPhase && player !== 'red') || (!isRedPhase && player !== 'blue')) return;
        if (gameState.selectedCard?.instanceId === card.instanceId) { setGameState(prev => ({ ...prev, selectedCard: null })); return; }
        setGameState(prev => ({ ...prev, selectedCard: card }));
      };

      // ── 部署战场牌 ──
      const playCard = (laneIndex) => {
        const card = gameState.selectedCard;
        if (!card || card.type !== 'battlefield') return;
        const player = GM.getPhasePlayer(gameState.phase);
        if (player !== myRole) return;
        const result = GM.playCard(gameState, card, player, laneIndex, false);
        if (result.error) { addLog(result.error); return; }
        setGameState(result.state);
      };

      // ── 部署建筑牌 ──
      const playBuilding = (laneIndex) => {
        const card = gameState.selectedCard;
        if (!card || card.type !== 'battlefield') return;
        const player = GM.getPhasePlayer(gameState.phase);
        if (player !== myRole) return;
        const result = GM.playCard(gameState, card, player, laneIndex, true);
        if (result.error) { addLog(result.error); return; }
        setGameState(result.state);
      };

      // ── 使用支援/奇迹（指定目标） ──
      const useCardOnTarget = (targetPlayer, laneIndex) => {
        const card = gameState.selectedCard;
        if (!card || (card.type !== 'support' && card.type !== 'miracle')) return;
        const player = GM.getPhasePlayer(gameState.phase);
        if (player !== myRole) return;
        const result = GM.useCardOnTarget(gameState, card, player, targetPlayer, laneIndex);
        if (result.error) { addLog(result.error); return; }
        showCardOverlay(card);
        setGameState(result.state);
      };

      // ── 使用支援/奇迹（无目标确认） ──
      const confirmUse = () => {
        const card = gameState.selectedCard;
        if (!card) return;
        const player = GM.getPhasePlayer(gameState.phase);
        if (player !== myRole) return;
        // 检查是否需要进入换位模式
        const swapCheck = GM.checkRequiresSwapMode(card, player);
        if (swapCheck) {
          setSwapMode(swapCheck.swapMode);
          addLog(swapCheck.logMsg);
          return;
        }
        const result = GM.confirmUse(gameState, card, player);
        if (result.error) { addLog(result.error); return; }
        showCardOverlay(card);
        setGameState(result.state);
      };

      // ── 阶段结束 ──
      const endPhase = () => {
        const target = GM.getNextPhase(gameState.phase);
        if (target === 'battle') {
          setGameState(prev => { const s = GM.clearSpaceMageFlags(prev); return { ...s, phase: 'battle', selectedCard: null, log: [...s.log, '--- 战斗阶段 ---'] }; });
          setTimeout(resolveBattle, 500);
        } else {
          setGameState(prev => { const s = GM.clearSpaceMageFlags(prev); return { ...s, phase: target, selectedCard: null, log: [...s.log, `--- ${GM.PHASE_NAMES[target]} ---`] }; });
        }
      };

      // ── 换位模式 ──
      const handleBattlefieldClick = (clickedPlayer, clickedLane) => {
        if (!swapMode) return;
        const currentPhasePlayer = GM.getPhasePlayer(gameState.phase);
        if (currentPhasePlayer !== myRole) return; // AI回合不响应
        const result = GM.handleSwapClick(gameState, swapMode, clickedPlayer, clickedLane, currentPhasePlayer);
        if (result.error) { addLog(result.error); return; }
        if (result.logMsg)      addLog(result.logMsg);
        if (result.continueMsg) addLog(result.continueMsg);
        if (result.state) setGameState(result.state);
        if (result.done) {
          const finalState = GM.finishSwapMode(result.state, swapMode);
          setGameState(finalState);
          setSwapMode(null);
          window.SoundManager.playSound('click');
        } else if (result.swapMode !== undefined) {
          setSwapMode(result.swapMode);
        }
      };

      const activateSpaceMage = (player, lane) => {
        if (player !== myRole) return;
        const result = GM.activateSpaceMage(gameState, player, lane);
        if (result.error) { addLog(result.error); return; }
        setSwapMode(result.swapMode);
        addLog(result.logMsg);
        window.SoundManager.playSound('click');
      };

      const finishSwapMode = () => {
        if (!swapMode) return;
        const finalState = GM.finishSwapMode(gameState, swapMode);
        setGameState(finalState);
        setSwapMode(null);
        window.SoundManager.playSound('click');
      };

      const cancelSwapMode = () => { setSwapMode(null); addLog('取消操作'); };

      // ── AI 执行回合（AI模式专属） ──
      useEffect(() => {
        if (!aiRole || gamePhase !== 'playing' || gameState.phase === 'idle' || gameState.phase === 'battle') return;
        const isAITurn = (gameState.phase === 'redDeploy' && aiRole === 'red')
          || (gameState.phase === 'blueDeploy' && aiRole === 'blue')
          || (gameState.phase === 'redSupport' && aiRole === 'red');
        if (isAITurn && !aiThinking.current) {
          aiThinking.current = true;
          setTimeout(() => { executeAITurn(); aiThinking.current = false; }, 1200);
        }
      }, [gameState.phase, aiRole, gamePhase]);

      const executeAITurn = () => {
        const aiFunc = difficulty === 'easy' ? AIEngine.easy : difficulty === 'medium' ? AIEngine.medium : AIEngine.hard;
        const decision = aiFunc(gameState, aiRole);
        if (decision.action === 'playCard') {
          const { card, lane } = decision;
          const playerState = gameState[aiRole];
          if (playerState.coins >= card.cost && playerState.battlefield[lane] === null) {
            window.SoundManager.playSound('place');
            const bf = [...playerState.battlefield]; bf[lane] = { ...card, baseAtk: card.atk, baseHp: card.hp };
            setGameState(prev => ({ ...prev, [aiRole]: { ...playerState, battlefield: bf, hand: playerState.hand.filter(c => c.instanceId !== card.instanceId), coins: playerState.coins - card.cost }, log: [...prev.log, `${aiRole === 'red' ? '红方' : '蓝方'}(AI) 在路线${lane+1}放置了 ${card.name}`] }));
            setTimeout(() => endPhase(), 800);
            return;
          }
        } else if (decision.action === 'useSupport') {
          const { card } = decision;
          const playerState = gameState[aiRole];
          const cost = card.type === 'miracle' ? 0 : card.cost;
          if (playerState.coins >= cost) {
            // 调用 GM.confirmUse 来正确处理卡牌效果和弃牌
            const result = GM.confirmUse(gameState, card, aiRole);
            if (!result.error) {
              addLog(`${aiRole === 'red' ? '红方' : '蓝方'}(AI) 使用了 ${card.name}`);
              showCardOverlay(card);
              setGameState(result.state);
              setTimeout(() => endPhase(), 1500);
              return;
            }
          }
        }
        setTimeout(() => endPhase(), 500);
      };

      // ── 战斗结算（委托给 GameManager） ──
      const resolveBattle = async () => {
        await GM.resolveBattle(gameState, {
          setBattleAnimation,
          onLaneResolve: (laneIndex, result) => {
            // 每条战线计算完成后立即更新卡牌在UI中的显示
            setGameState(prev => {
              const newState = JSON.parse(JSON.stringify(prev));
              newState.red.battlefield[laneIndex] = result.red;
              newState.blue.battlefield[laneIndex] = result.blue;
              if (result.redBuilding) newState.red.buildings[laneIndex] = result.redBuilding;
              if (result.blueBuilding) newState.blue.buildings[laneIndex] = result.blueBuilding;
              // 🔴 实时更新玩家血量
              newState.red.health = result.redHP;
              newState.blue.health = result.blueHP;
              return newState;
            });
          },
          onFinish: ({ state: finalState, winner: w }) => {
            setGameState(finalState);
            if (w) setWinner(w);
            setTimeout(() => {
              setGameState(prev => {
                const result = GM.checkDeckEmpty(prev, w);
                if (result) { setWinner(result.winner); return result.state; }
                return prev;
              });
            }, 100);
          }
        });
      };

      const reset = () => {
        setWinner(null); setGamePhase('notStarted'); setBattleAnimation({ active: false, lane: -1 });
        setMyRole(null); setAiRole(null); setRouletteResult(null); initGame();
      };

      if (!uiReady) return <div className="text-white text-center mt-40 text-xl">加载中…</div>;

      // ── 难度选择界面（AI专属） ──
      if (gamePhase === 'notStarted' && !myRole) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center p-4">
            <div className="bg-gray-800 rounded-2xl p-8 max-w-md w-full shadow-2xl border-2 border-purple-500">
              <h1 className="text-3xl font-bold text-white text-center mb-6">选择 AI 难度</h1>
              <div className="space-y-4">
                <button onClick={() => { setDifficulty('easy');   spinRoulette(); }} className="w-full py-4 rounded-lg font-bold text-xl bg-gray-700 hover:bg-green-600  text-white transition-all">😊 简单 - 随机出牌</button>
                <button onClick={() => { setDifficulty('medium'); spinRoulette(); }} className="w-full py-4 rounded-lg font-bold text-xl bg-gray-700 hover:bg-yellow-600 text-white transition-all">🤔 中等 - 优先高攻</button>
                <button onClick={() => { setDifficulty('hard');   spinRoulette(); }} className="w-full py-4 rounded-lg font-bold text-xl bg-gray-700 hover:bg-red-600    text-white transition-all">😈 困难 - 策略评估</button>
              </div>
              <button onClick={() => window.location.href = 'index.html'} className="w-full mt-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-bold">返回主界面</button>
            </div>
          </div>
        );
      }

      // ── 轮盘动画（AI专属） ──
      if (showRoulette) {
        return (
          <div className="fixed inset-0 bg-black bg-opacity-90 z-[200] flex items-center justify-center">
            <div className="text-center">
              <h1 className="text-4xl font-bold text-white mb-8">红蓝抽签中...</h1>
              <div className="relative w-64 h-64 mx-auto">
                <div className="absolute inset-0 rounded-full border-8 border-gray-700 overflow-hidden animate-spin" style={{ animationDuration: '0.5s' }}>
                  <div className="absolute top-0 left-0 w-full h-1/2 bg-red-600"></div>
                  <div className="absolute bottom-0 left-0 w-full h-1/2 bg-blue-600"></div>
                </div>
                <div className="absolute inset-0 flex items-center justify-center">
                  <div className="w-4 h-20 bg-yellow-400 rounded-full shadow-2xl" style={{ transform: 'translateY(-60px)' }}></div>
                </div>
              </div>
              {rouletteResult && <div className="mt-8 text-3xl font-bold animate-pulse text-white">{rouletteResult === 'red' ? '🔴 你是红方！' : '🔵 你是蓝方！'}</div>}
            </div>
          </div>
        );
      }

      if (gamePhase === 'redPicking' && aiRole === 'red') setTimeout(() => aiPickCards('red'), 500);

      return (
        <GameUI
          gameState={gameState} gamePhase={gamePhase} allCards={allCards} winner={winner}
          battleAnimation={battleAnimation} cardShowOverlay={cardShowOverlay}
          swapMode={swapMode}
          onStartPicking={() => {}} onPickCard={pickCard} onStartTurn={startTurn}
          onSelectCard={selectCard} onPlayCard={playCard} onPlayBuilding={playBuilding} onUseCardOnTarget={useCardOnTarget}
          onConfirmUse={confirmUse} onEndPhase={endPhase} onReset={reset}
          onBattlefieldClick={handleBattlefieldClick}
          onFinishSwap={finishSwapMode}
          onCancelSwap={cancelSwapMode}
          onActivateSpaceMage={activateSpaceMage}
          hideOpponentHand={true} myRole={myRole}
        />
      );
    };

    ReactDOM.render(<AIGame />, document.getElementById('root'));
    </script>
</body>
</html>
